<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            background: #fff;
        }
        body {
            display: flex;
            justify-content: flex-end;
            align-items: flex-start;
        }
        .wrap {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            height: 95vh;
            width: 100vw;
            margin-top: 5vh;
            padding: 0;
        }
        .content {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.3;
            color: #000;
            white-space: pre-wrap;
            margin: 0 1px 0 1px;
            flex: 1;
            min-width: 0;
            text-align: left;
        }
        .photo-container {
            flex: 0 0 66.666%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
        }
        a {
            color: #000;
            text-decoration: underline;
        }
        img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            object-position: left top;
        }

        /* Mobile Responsive Layout (Screens 768px wide and below) */
        @media (max-width: 768px) {
            body {
                display: block;
                height: auto;
                overflow-y: auto;
            }
            .wrap {
                flex-direction: column;
                height: auto;
                width: 100%;
                margin-top: 2vh;
                padding: 0 1px; /* 1px margin on left and right edges */
            }
            .content {
                margin: 0 0 15px 0; /* Space between text and photo stacked below */
                width: 100%;
            }
            .photo-container {
                flex: none;
                width: 100%;
                height: auto;
                justify-content: center;
            }
            img {
                width: 100%;
                max-height: 70vh; /* Keeps mobile photo from taking up too much vertical space */
                object-position: center top;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>.</p>
        <div class="photo-container">
            <img id="randomPhoto" alt="">
        </div>
    </div>

    <script>
        // Add the filename of every photo in your /photos folder here.
        const photos = [
            "dotslinesshapesspaces.webp",
            "stripestriangles.webp",
            "nicepark.webp",
            "macbethquestionmark.jpg",
            "dogsinwindow.jpg"
        ];

        const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
        const chosen = photos[Math.floor(Math.random() * photos.length)];
        document.getElementById("randomPhoto").src = base + chosen;
    </script>
</body>
</html>
