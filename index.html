<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <meta name="description" content="Personal website of Colin Maier — co-founder of Ranch Pressing, founder of Small Business, and photographer.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: auto;
            width: 100%;
            margin: 0;
            background: #fff;
            overflow-y: auto;
        }
        body {
            display: block;
        }

        /* ===== Base layout (this is now the ONLY layout — same on mobile and desktop) ===== */
        .wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 5vh;
            padding: 0;
        }
        .content {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.3;
            color: #000;
            white-space: pre-wrap;
            margin: 0 1px 1px 1px;
            width: calc(100% - 2px);
            text-align: left;
        }
        .photo-container {
            flex: none;
            width: 100%;
            height: auto;
            margin-top: 1px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        a {
            font-weight: bold;
            text-decoration: none;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: none;
            object-fit: contain;
            object-position: center top;
        }

        /*
          ===== Desktop scaling =====
          Reference width = the design width the mobile layout was tuned for.
          Above that width, `zoom` scales the whole page (text + photos +
          spacing) up proportionally instead of switching to a different
          layout — desktop just looks like a bigger version of mobile.

          This CSS rule sets an initial width-based zoom immediately (so
          there's no flash of tiny unscaled text/photo before JS runs).
          The script below then measures the actual rendered height and
          dials the zoom back down if a fully scaled photo would require
          vertical scrolling — so scaling effectively caps out once the
          screen is too small (in height) for the width-scaled version to
          fit.

          (hover: hover) and (pointer: fine) restricts this to devices
          with a mouse/trackpad — i.e. actual desktops/laptops — rather
          than any screen over 420px wide. Without this, a phone in
          landscape (width > 420px but a touchscreen) would get treated
          as "desktop", scaled up, then immediately shrunk back down hard
          to avoid overflow, making the text tiny. Touch devices are left
          at their natural 1:1 mobile layout regardless of orientation.
        */
        @media (min-width: 421px) and (hover: hover) and (pointer: fine) {
            html {
                zoom: calc(100vw / 420);
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>. You can contact me <a href="mailto:colinmaier.au.3itkf@passmail.net">here</a>.</p>
        <div class="photo-container">
            <img id="randomPhoto" alt="">
        </div>
    </div>

    <script>
        (function () {
            // Add the filename of every photo in your /photos folder here.
            const photos = [
                "dotslinesshapesspaces.webp",
                "nicepark.webp",
                "macbethquestionmark.jpg",
                "dogsinwindow.jpg",
                "53windsreno.webp",
                "Loungesuites.webp",
                "Youyangs.webp",
                "acdp.webp",
                "broughamst.webp",
                "brooklynfleamarket.webp",
                "burlingtoncoatfactory.webp",
                "easternpark.webp",
                "geelongcarpark.webp",
                "geelongwest.webp",
                "murraybigtree.webp",
                "tullamarinerainbow.webp",
                "whittingtonrose.webp",
                "whitesbeach.webp",
                "whittingtonwaterpark.webp",
                "woomelang.webp",
                "villagecinemaglenorchy.webp"
            ];

            const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
            const chosen = photos[Math.floor(Math.random() * photos.length)];
            const imgEl = document.getElementById("randomPhoto");
            const wrap = document.querySelector(".wrap");
            const DESIGN_WIDTH = 420;

            function setZoom(z) {
                document.documentElement.style.zoom = z;
            }

            // Matches the CSS media query above: only treat this as a
            // "desktop" that should scale up if it's a fine-pointer,
            // hover-capable device. A phone in landscape is still a
            // touchscreen, so it's excluded and kept at its natural
            // mobile layout instead of being scaled up and then
            // aggressively shrunk back down.
            function isDesktopLike() {
                return window.matchMedia &&
                    window.matchMedia("(hover: hover) and (pointer: fine)").matches;
            }

            // Starts from the same width-based zoom as before, then shrinks
            // it further (never below what's needed to fill the width) so
            // the fully scaled content never exceeds the viewport height.
            function fitZoom() {
                if (window.innerWidth <= DESIGN_WIDTH || !isDesktopLike()) {
                    setZoom(1);
                    return;
                }

                let zoom = window.innerWidth / DESIGN_WIDTH;
                setZoom(zoom);

                // A few passes to converge, since vh-based spacing doesn't
                // scale perfectly linearly with zoom.
                for (let i = 0; i < 3; i++) {
                    const contentHeight = wrap.getBoundingClientRect().height;
                    if (contentHeight <= window.innerHeight + 1) break;
                    zoom = zoom * (window.innerHeight / contentHeight);
                    setZoom(zoom);
                }
            }

            let resizeTimer;
            window.addEventListener("resize", function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(fitZoom, 100);
            });

            // Re-fit once the photo has actually loaded (its natural
            // aspect ratio determines its height at any given width).
            imgEl.addEventListener("load", fitZoom);
            imgEl.src = base + chosen;

            // Run once immediately too, so sizing is reasonable even
            // before the image finishes loading.
            fitZoom();
        })();
    </script>
</body>
</html>
