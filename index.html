<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <meta name="description" content="Personal website of Colin Maier — co-founder of Ranch Pressing, founder of Small Business, and photographer.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <style>
        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            /* Lock the page to exactly the visible viewport. dvh (dynamic
               viewport height) tracks the real visible area on mobile as
               the browser's address bar shows/hides; vh is the fallback
               for browsers that don't support dvh yet. */
            height: 100vh;
            height: 100dvh;
            background: #fff;
            /* Deliberately NOT overflow: hidden here — the layout below
               is sized to fit exactly, so nothing actually scrolls, but
               leaving default overflow lets mobile browsers still detect
               the pull-to-refresh gesture. */
        }

        /*
          ===== Layout =====
          A single flex column, exactly as tall as the viewport:
            - .content is fixed-size and never shrinks below readable size.
            - .photo-container takes whatever vertical space is left over
              (flex: 1, min-height: 0) and the <img> inside it uses
              object-fit: contain, so the photo is always scaled to fit
              entirely within that space — never cropped, never taller
              than what's visible, never causing a scrollbar.
        */
        .page {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 2vh 1px 1px 1px;
        }

        .content {
            flex: 0 0 auto;
            font-family: "Courier New", Courier, monospace;
            /* Scales up gently on wider screens for readability, but
               clamp()'s floor guarantees it is never smaller than 14px
               regardless of viewport size or orientation. */
            font-size: clamp(14px, 1.4vw, 20px);
            line-height: 1.3;
            color: #000;
            white-space: pre-wrap;
            margin: 0 1px 1px 1px;
            width: calc(100% - 2px);
            text-align: left;
        }

        .photo-container {
            flex: 1 1 auto;
            min-height: 0; /* required for flex children to shrink properly */
            width: 100%;
            margin-top: 1px;
            overflow: hidden;
        }

        a {
            font-weight: bold;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
            /* Full width, always — never cropped left/right. If the
               resulting height is taller than the space left over after
               the text, .photo-container's overflow: hidden clips the
               excess off the bottom only. */
        }
    </style>
</head>
<body>
    <div class="page">
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>. You can contact me <a href="mailto:colinmaier.au.3itkf@passmail.net">here</a>.</p>
        <div class="photo-container">
            <img id="randomPhoto" alt="">
        </div>
    </div>

    <script>
        // Add the filename of every photo in your /photos folder here.
        const photos = [
            "dotslinesshapesspaces.webp",
            "nicepark.webp",
            "macbethquestionmark.jpg",
            "dogsinwindow.jpg",
            "53windsreno.webp",
            "Loungesuites.webp",
            "Youyangs.webp",
            "acdp.webp",
            "broughamst.webp",
            "brooklynfleamarket.webp",
            "burlingtoncoatfactory.webp",
            "easternpark.webp",
            "geelongcarpark.webp",
            "geelongwest.webp",
            "murraybigtree.webp",
            "tullamarinerainbow.webp",
            "whittingtonrose.webp",
            "whitesbeach.webp",
            "whittingtonwaterpark.webp",
            "woomelang.webp",
            "villagecinemaglenorchy.webp"
        ];

        const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
        const chosen = photos[Math.floor(Math.random() * photos.length)];
        document.getElementById("randomPhoto").src = base + chosen;
    </script>
</body>
</html>
