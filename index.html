<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <meta name="description" content="Personal website of Colin Maier — co-founder of Ranch Pressing, founder of Small Business, and photographer.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: auto;
            width: 100%;
            margin: 0;
            background: #fff;
            overflow-y: auto;
        }
        body {
            display: block;
        }

        /* ===== Base layout (this is now the ONLY layout — same on mobile and desktop) ===== */
        .wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 0;
            padding: 0;
        }
        .content {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            line-height: 1.3;
            color: #000;
            white-space: pre-wrap;
            margin: 0 1px 1px 1px;
            width: calc(100% - 2px);
            text-align: left;
            order: 1;
        }
        .photo-container {
            flex: none;
            width: 100%;
            height: auto;
            margin-top: 1px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            order: 2;
        }
        a {
            font-weight: bold;
            text-decoration: none;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: none;
            object-fit: contain;
            object-position: center top;
        }

        /*
          ===== Desktop layout =====
          769px+ only. Some large phones (e.g. iPhone Pro Max) report a CSS
          viewport width over 420px in portrait, so the breakpoint is set
          well above any phone width to keep this strictly desktop/tablet.
        */
        @media (min-width: 769px) {
            /* Allow vertical scrolling (so pull-to-refresh works), but never
               let horizontal scrollbars appear. */
            html, body {
                overflow-x: hidden;
                overflow-y: auto;
            }
            /* flow-root (rather than the mobile flex layout) so the floated
               photo and the wrapping text behave like a normal document:
               text hugs the photo's left edge, then drops to full width
               once it passes the photo's bottom. */
            .wrap {
                display: flow-root;
                /* width set via JS to the golden-ratio total (photo + text) */
            }
            .content {
                font-size: 18px; /* fallback; JS shrinks this down to a 14px floor as needed */
                margin: 0 1px 1px 0;
                width: auto; /* must be auto, not the mobile calc(100% - 2px), so it wraps around the float */
                overflow-wrap: break-word;
                word-break: break-word;
            }
            .photo-container {
                display: block; /* override the mobile flex display */
                width: auto; /* override the mobile 100% width so the float shrinks to the photo's size */
                float: right;
                margin-top: 0;
                margin-left: 8px;
                margin-bottom: 1px;
            }
            .photo-container img {
                display: block;
                object-fit: contain;
                max-width: none; /* override the mobile max-width: 100%, which creates a circular sizing conflict against a shrink-to-fit float */
                /* width/height set precisely via JS in pixels, not percentages
                   or transform, so the float's reserved space always matches
                   the photo's actual visible size */
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="photo-container">
            <img id="randomPhoto" alt="">
        </div>
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>. You can contact me <a href="mailto:colinmaier.au.3itkf@passmail.net">here</a>.</p>
    </div>

    <script>
        // Add the filename of every photo in your /photos folder here.
        const photos = [
            "dotslinesshapesspaces.webp",
            "nicepark.webp",
            "macbethquestionmark.jpg",
            "dogsinwindow.jpg",
            "53windsreno.webp",
            "wurdi youang.jpg",
            "acdp.JPG",
            "broughamst.webp",
            "brooklynfleamarket.webp",
            "burlingtoncoatfactory.webp",
            "easternpark.jpeg",
            "geelongcarpark.webp",
            "murraybigtree.webp",
            "tullamarinerainbow.webp",
            "whittingtonrose.webp",
            "whitesbeach.JPG",
            "whittingtonwaterpark.webp",
            "woomelang.webp",
            "villagecinemaglenorchy.webp"  
        ];

        const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
        const chosen = photos[Math.floor(Math.random() * photos.length)];
        const photoEl = document.getElementById("randomPhoto");
        photoEl.src = base + chosen;

        // On desktop, the photo is 2/3 of the window height, floated right.
        // The wrap's total width is set so the leftover space beside the
        // photo (where the text wraps) is in golden-ratio proportion to the
        // photo's width. The font-size is shrunk (down to a 14px floor) to
        // try to fit the text within the photo's height; any text that still
        // doesn't fit naturally wraps to full width below the photo.
        function fitTextHeight(targetHeight) {
            const content = document.querySelector(".content");
            const MIN_FONT_SIZE = 14;
            let lo = MIN_FONT_SIZE, hi = 200;
            content.style.fontSize = MIN_FONT_SIZE + "px";
            if (content.getBoundingClientRect().height >= targetHeight) {
                // Even the minimum size doesn't fit within the photo's height;
                // stay at the floor and let the overflow wrap below instead.
                return;
            }
            for (let i = 0; i < 25; i++) {
                const mid = (lo + hi) / 2;
                content.style.fontSize = mid + "px";
                const h = content.getBoundingClientRect().height;
                if (h <= targetHeight) {
                    lo = mid;
                } else {
                    hi = mid;
                }
            }
            content.style.fontSize = lo + "px";
        }

        function syncDesktopLayout() {
            const content = document.querySelector(".content");
            const wrap = document.querySelector(".wrap");
            const isDesktop = window.matchMedia("(min-width: 769px)").matches;
            if (!isDesktop) {
                content.style.fontSize = "";
                wrap.style.width = "";
                photoEl.style.width = "";
                photoEl.style.height = "";
                return;
            }
            if (!photoEl.naturalWidth || !photoEl.naturalHeight) {
                return;
            }
            const GOLDEN_RATIO = 1.6180339887;
            const targetH = window.innerHeight * (2 / 3);
            const targetW = targetH * (photoEl.naturalWidth / photoEl.naturalHeight);

            photoEl.style.height = targetH + "px";
            photoEl.style.width = targetW + "px";
            wrap.style.width = (targetW * GOLDEN_RATIO) + "px";

            fitTextHeight(targetH);
        }

        photoEl.addEventListener("load", syncDesktopLayout);
        window.addEventListener("resize", syncDesktopLayout);
    </script>
</body>
</html>
