<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            background: #fff;
            overflow: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        .wrap {
            display: flex;
            flex-direction: row; /* Changed to row to place text and photo side-by-side */
            align-items: flex-start; /* Aligns them at the top in line with each other */
            height: 100%;
            padding-left: 4px;
        }
        .content {
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
            line-height: 1.3;
            color: #000;
            padding: 4px 0;
            white-space: pre-wrap;
            margin: 20vh 0 0 0;
            width: 400px; /* Adjust width as needed for your text column */
            flex-shrink: 0;
        }
        a {
            color: #000;
            text-decoration: underline;
        }
        img {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            flex: 1; /* Takes up the remaining space on the right */
            min-width: 0;
            min-height: 0;
            object-fit: contain;
            object-position: right top;
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>.</p>
        <img id="randomPhoto" alt="">
    </div>

    <script>
        // Add the filename of every photo in your /photos folder here.
        const photos = [
            "dotslinesshapesspaces.webp",
            "wateringgarden.jpg",
            "alohaapco.jpg",
            "macbethquestionmark.jpg",
            "doginwindow.jpg"
        ];

        const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
        const chosen = photos[Math.floor(Math.random() * photos.length)];
        document.getElementById("randomPhoto").src = base + chosen;
    </script>
</body>
</html>
