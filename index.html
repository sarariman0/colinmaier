<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colin Maier</title>
    <meta name="description" content="Personal website of Colin Maier — co-founder of Ranch Pressing, founder of Small Business, and photographer.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">
    <style>
        * { box-sizing: border-box; }
        html, body {
            height: auto;
            width: 100%;
            margin: 0;
            background: #fff;
            overflow-y: auto;
        }
        body {
            display: block;
        }

        /* ===== Base layout (this is now the ONLY layout — same on mobile and desktop) ===== */
        .wrap {
            display: flex;
            flex-direction: column;
            width: 100%;
            margin-top: 0;
            padding: 0;
        }
        .content {
            font-family: "Courier New", Courier, monospace;
            font-size: 15px;
            line-height: 1.3;
            color: #000;
            white-space: pre-wrap;
            margin: 0 1px 1px 1px;
            width: calc(100% - 2px);
            text-align: left;
        }
        .photo-container {
            flex: none;
            width: 100%;
            height: auto;
            margin-top: 1px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }
        a {
            font-weight: bold;
            text-decoration: none;
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: none;
            object-fit: contain;
            object-position: center top;
        }

        /*
          ===== Desktop scaling =====
          Reference width = the design width the mobile layout was tuned for.
          Zoom scales the whole page (text + photo together), so desktop
          looks like the same proportions as mobile, just bigger — rather
          than a fixed 14px reading as small on a much bigger screen.
        */
        @media (min-width: 421px) {
            html {
                zoom: calc(100vw / 420);
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="content">Hi, this is the personal website of Colin Maier, co-founder of <a href="https://www.ranchpressing.net" target="_blank" rel="noopener">Ranch Pressing</a>, founder of <a href="http://www.smallbusine.ss" target="_blank" rel="noopener">Small Business</a> and <a href="https://www.instagram.com/cckckkmkmm" target="_blank" rel="noopener">half-serious photographer</a>. You can contact me <a href="mailto:colinmaier.au.3itkf@passmail.net">here</a>.</p>
        <div class="photo-container">
            <img id="randomPhoto" alt="">
        </div>
    </div>

    <script>
        // Add the filename of every photo in your /photos folder here.
        const photos = [
            "dotslinesshapesspaces.webp",
            "nicepark.webp",
            "macbethquestionmark.jpg",
            "dogsinwindow.jpg",
            "53windsreno.webp",
            "Loungesuites.webp",
            "Youyangs.webp",
            "acdp.webp",
            "broughamst.webp",
            "brooklynfleamarket.webp",
            "burlingtoncoatfactory.webp",
            "easternpark.webp",
            "geelongcarpark.webp",
            "geelongwest.webp",
            "murraybigtree.webp",
            "tullamarinerainbow.webp",
            "whittingtonrose.webp",
            "whitesbeach.webp",
            "whittingtonwaterpark.webp",
            "woomelang.webp",
            "villagecinemaglenorchy.webp"  
        ];

        const base = "https://raw.githubusercontent.com/sarariman0/colinmaier/refs/heads/main/photos/";
        const chosen = photos[Math.floor(Math.random() * photos.length)];
        document.getElementById("randomPhoto").src = base + chosen;
    </script>
</body>
</html>
